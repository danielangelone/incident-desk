spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/incidentdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:incidentdesk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:incidentdesk}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.locations=classpath:db/migration
