services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidentdesk
      POSTGRES_USER: incidentdesk
      POSTGRES_PASSWORD: incidentdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentdesk"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/incidentdesk
      SPRING_DATASOURCE_USERNAME: incidentdesk
      SPRING_DATASOURCE_PASSWORD: incidentdesk
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
